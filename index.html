<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Répertoire Horloger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#efe9dc">
<style>
  :root{
    --paper: #efe9dc;
    --paper-raised: #f7f3ea;
    --ink: #26241f;
    --ink-soft: #5a564a;
    --ink-faint: #928c7a;
    --rule: #cfc6ac;
    --copper: #9a5b32;
    --copper-deep: #7a4726;
    --sage: #5f7259;
    --card-shadow: 0 1px 0 rgba(38,36,31,0.06);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      repeating-linear-gradient(0deg, rgba(38,36,31,0.015) 0px, rgba(38,36,31,0.015) 1px, transparent 1px, transparent 34px),
      var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    min-height: 100vh;
    padding-bottom: 50px;
  }
  .mono{ font-family: 'JetBrains Mono', 'Courier New', monospace; }
  .sans{ font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }

  header{ padding: 26px 20px 18px; border-bottom: 2px solid var(--ink); }
  .eyebrow{ text-transform: uppercase; letter-spacing: 3px; font-size: 10px; color: var(--copper); font-weight: 600; margin-bottom: 6px; font-family: -apple-system, 'Segoe UI', sans-serif; }
  h1{ font-size: 27px; font-weight: 400; letter-spacing: 0.3px; margin: 0 0 5px; font-style: italic; }
  .tagline{ color: var(--ink-soft); font-size: 12.5px; max-width: 480px; line-height: 1.55; font-family: -apple-system, 'Segoe UI', sans-serif; }

  .header-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; font-family: -apple-system, 'Segoe UI', sans-serif; }
  .hbtn{ background: var(--paper-raised); border:1px solid var(--ink); color: var(--ink); font-size: 11px; padding: 7px 13px; cursor:pointer; letter-spacing:0.2px; }
  .hbtn:active{ background: var(--ink); color: var(--paper); }
  .sync-line{ font-size: 10px; color: var(--ink-faint); margin-top: 9px; font-family: -apple-system, sans-serif; letter-spacing:0.3px; }

  nav.tabs{ display:flex; gap:2px; padding: 0 20px; overflow-x:auto; border-bottom: 1px solid var(--rule); background: var(--paper-raised); }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{ background:none; border:none; color: var(--ink-soft); font-family: Georgia, serif; font-style: italic; font-size: 14.5px; padding: 12px 13px; cursor:pointer; white-space:nowrap; border-bottom: 3px solid transparent; }
  .tab-btn.active{ color: var(--copper-deep); border-bottom-color: var(--copper-deep); font-style: normal; font-weight:600; }

  main{ padding: 18px 16px 0; max-width: 640px; margin: 0 auto; }
  .panel{ animation: fade .2s ease; }
  @keyframes fade{ from{opacity:0;} to{opacity:1;} }

  .section-title{ display:flex; align-items:baseline; justify-content:space-between; margin: 16px 0 10px; }
  .section-title h2{ font-size: 17px; font-weight:400; font-style:italic; margin:0; }
  .section-title .count{ color: var(--ink-faint); font-size: 11px; font-family: -apple-system, sans-serif; }

  .brand-news{ border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); padding: 10px 0 6px; margin-bottom: 18px; }
  .brand-news .eyebrow{ margin-bottom:8px; }
  .news-item{ padding: 2px 0 2px 0; margin-bottom: 11px; font-family: -apple-system, sans-serif; }
  .news-date{ font-size: 10px; color: var(--copper-deep); letter-spacing:0.5px; font-weight:600; }
  .news-text{ font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; line-height:1.5; }
  .news-source{ font-size: 11px; margin-top:4px; }
  .news-source a{ color: var(--ink-soft); text-decoration: underline; text-decoration-color: var(--rule); }

  .card{ background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 3px; padding: 14px 14px 12px; margin-bottom: 12px; box-shadow: var(--card-shadow); }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card-model{ font-size: 16px; font-weight:400; line-height:1.3; }
  .card-ref{ color: var(--ink-faint); font-size: 10.5px; margin-top:3px; font-family: -apple-system, sans-serif; letter-spacing:0.3px; }

  .price-row{ display:flex; align-items:baseline; gap:10px; margin-top:11px; flex-wrap:wrap; font-family: -apple-system, sans-serif; }
  .price-block{ display:flex; align-items:baseline; gap:5px; }
  .price-label{ font-size: 9.5px; color: var(--ink-faint); text-transform:uppercase; letter-spacing:0.6px; }
  .price-new-val{ font-size: clamp(15px, 4.4vw, 19px); font-weight:700; color: var(--copper-deep); }
  .price-used-val{ font-size: clamp(12px, 3.6vw, 14px); color: var(--sage); font-weight:600; }
  .price-unknown{ color: var(--ink-faint); font-style: italic; font-weight:400; }
  .price-reason{ font-size: 10.5px; color: var(--ink-faint); font-style: italic; font-weight:400; }
  .price-date{ font-size: 9.5px; color: var(--ink-faint); margin-top:4px; font-family: -apple-system, sans-serif; }
  .flag{ display:inline-block; font-size: 8.5px; letter-spacing:1px; text-transform:uppercase; color: var(--copper-deep); border:1px solid var(--copper-deep); padding: 1px 6px; border-radius:20px; margin-left:8px; font-family: -apple-system, sans-serif; vertical-align:middle; }

  .specs{ display:grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 12px; padding-top: 11px; border-top: 1px dashed var(--rule); font-family: -apple-system, sans-serif; }
  .spec{ font-size: 11.5px; color: var(--ink-soft); }
  .spec b{ display:block; font-size: 9px; text-transform:uppercase; letter-spacing:0.5px; color: var(--ink-faint); font-weight:600; margin-bottom:1px; }

  .card-note{ font-size: 12.5px; color: var(--ink-soft); margin-top:10px; line-height:1.55; font-family: -apple-system, sans-serif; }

  .card-actions{ margin-top:10px; font-family: -apple-system, sans-serif; display:flex; gap:14px; align-items:center; }
  .card-actions a, .card-actions .variants-toggle{ font-size: 11.5px; color: var(--ink-soft); text-decoration: underline; text-decoration-color: var(--rule); }
  .variants-toggle{ background:none; border:none; padding:0; cursor:pointer; font-weight:600; color: var(--copper-deep) !important; font-family: -apple-system, sans-serif; letter-spacing:0.2px; }
  .variants-list{ display:none; margin-top:8px; padding: 9px 11px; background: var(--paper); border-left: 2px solid var(--copper); font-family: -apple-system, sans-serif; }
  .variants-list.open{ display:block; }
  .variants-list span{ display:inline-block; font-size: 11px; color: var(--ink-soft); background: var(--paper-raised); border:1px solid var(--rule); padding:3px 8px; border-radius:20px; margin: 2px 4px 2px 0; }
  .variant-group{ margin-bottom:8px; }
  .variant-group:last-child{ margin-bottom:0; }
  .variant-group b{ display:block; font-size:9px; text-transform:uppercase; letter-spacing:0.5px; color: var(--ink-faint); font-weight:600; margin-bottom:4px; }

  .trend-card{ background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 3px; padding: 13px 14px; margin-bottom: 12px; box-shadow: var(--card-shadow); }
  .trend-top{ display:flex; justify-content:space-between; gap:10px; }
  .trend-brand{ font-size: 10px; text-transform:uppercase; letter-spacing:1px; color: var(--copper-deep); font-weight:700; font-family: -apple-system, sans-serif; }
  .trend-model{ font-size: 16px; margin-top:2px; }
  .trend-price{ font-size: 11px; color: var(--sage); font-weight:600; text-align:right; white-space:nowrap; font-family: -apple-system, sans-serif; }
  .trend-note{ font-size: 12.5px; color: var(--ink-soft); margin-top:8px; line-height:1.55; font-family: -apple-system, sans-serif; }
  .trend-date{ font-size: 10px; color: var(--ink-faint); margin-top:8px; font-family: -apple-system, sans-serif; }

  .promos{ margin-top:11px; padding-top:10px; border-top: 1px dashed var(--rule); font-family: -apple-system, sans-serif; }
  .promos-label{ font-size: 9.5px; text-transform:uppercase; letter-spacing:0.6px; color: var(--ink-faint); margin-bottom:5px; }
  .promo-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:12px; padding:2px 0; }
  .promo-row a{ color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); }
  .promo-price{ color: var(--copper-deep); font-weight:600; }
  .promos-disclaimer{ font-size: 10px; color: var(--ink-faint); font-style: italic; margin-top:4px; }

  .add-form{ background: var(--paper-raised); border: 1px solid var(--rule); border-radius:3px; padding: 16px; font-family: -apple-system, sans-serif; }
  .add-form label{ display:block; font-size: 10.5px; text-transform:uppercase; letter-spacing:0.5px; color: var(--ink-faint); margin: 12px 0 4px; }
  .add-form label:first-child{ margin-top:0; }
  .add-form input, .add-form select, .add-form textarea{
    width:100%; background: var(--paper); border:1px solid var(--rule); color: var(--ink);
    padding:9px 10px; font-size:13px; font-family: -apple-system, sans-serif; border-radius:2px;
  }
  .add-form textarea{ min-height:50px; resize:vertical; }
  .add-form .btn-submit{
    margin-top:16px; width:100%; background: var(--ink); color: var(--paper); border:none;
    padding:11px; font-size:13px; font-weight:600; cursor:pointer; letter-spacing:0.3px;
  }
  .add-list-item{ font-size:12.5px; color: var(--ink-soft); padding:8px 0; border-bottom:1px dashed var(--rule); font-family:-apple-system,sans-serif; display:flex; justify-content:space-between; }

  .empty{ text-align:center; color: var(--ink-faint); font-size:12.5px; padding: 24px 10px; border: 1px dashed var(--rule); font-family: -apple-system, sans-serif; }
  .footer-note{ text-align:center; font-size: 10.5px; color: var(--ink-faint); padding: 24px 20px 10px; font-family: -apple-system, sans-serif; }

  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background: var(--ink); color: var(--paper); font-size:12px; font-weight:600; padding:9px 16px; border-radius:3px; opacity:0; pointer-events:none; transition: opacity .2s; font-family: -apple-system, sans-serif; }
  #toast.show{ opacity:1; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Suivi personnel</div>
  <h1>Répertoire Horloger</h1>
  <div class="tagline">Prix et nouveautés pour les marques suivies — mis à jour à la demande, sans scraping automatique.</div>
  <div class="header-actions">
    <button class="hbtn" id="btn-reload">↻ Recharger les données</button>
    <button class="hbtn" id="btn-claude">✎ Demander à Claude</button>
  </div>
  <div class="sync-line mono" id="sync-line"></div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div class="footer-note">Répertoire personnel — actualisation manuelle via Claude.</div>
<div id="toast"></div>

<script>
const DATA_URL = 'data.json';
const BRAND_ORDER = ["omega", "tissot", "lip", "orient"];
let DATA = null;
let activeBrand = "omega";

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function loadData(forceFresh){
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    DATA = await res.json();
    localStorage.setItem('watch-tracker:cache', JSON.stringify(DATA));
    return true;
  } catch(e){
    const cached = localStorage.getItem('watch-tracker:cache');
    if (cached){ DATA = JSON.parse(cached); return false; }
    DATA = { updated: null, brands: {}, trending: [] };
    return false;
  }
}

// ---------- Ajouts personnels (stockés en local, jamais écrasés par une actualisation) ----------
function loadCustom(){
  try { return JSON.parse(localStorage.getItem('watch-tracker:custom') || '{}'); }
  catch(e){ return {}; }
}
function saveCustom(custom){
  localStorage.setItem('watch-tracker:custom', JSON.stringify(custom));
}
function loadCustomBrandLabels(){
  try { return JSON.parse(localStorage.getItem('watch-tracker:custom-brand-labels') || '{}'); }
  catch(e){ return {}; }
}
function saveCustomBrandLabels(labels){
  localStorage.setItem('watch-tracker:custom-brand-labels', JSON.stringify(labels));
}
function brandLabel(key){
  if (DATA.brands[key]) return DATA.brands[key].label;
  const labels = loadCustomBrandLabels();
  return labels[key] || key;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = "";

  const trendBtn = document.createElement('button');
  trendBtn.className = 'tab-btn' + (activeBrand === 'trending' ? ' active' : '');
  trendBtn.textContent = 'À la mode';
  trendBtn.onclick = () => { activeBrand = 'trending'; render(); };
  tabs.appendChild(trendBtn);

  BRAND_ORDER.forEach(key => {
    if (!DATA.brands[key]) return;
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (key === activeBrand ? ' active' : '');
    btn.textContent = DATA.brands[key].label;
    btn.onclick = () => { activeBrand = key; render(); };
    tabs.appendChild(btn);
  });

  const custom = loadCustom();
  Object.keys(custom).filter(k => !BRAND_ORDER.includes(k) && (custom[k]||[]).length > 0).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (key === activeBrand ? ' active' : '');
    btn.textContent = brandLabel(key);
    btn.onclick = () => { activeBrand = key; render(); };
    tabs.appendChild(btn);
  });

  const newsBtn = document.createElement('button');
  newsBtn.className = 'tab-btn' + (activeBrand === 'news' ? ' active' : '');
  newsBtn.textContent = 'Nouveautés';
  newsBtn.onclick = () => { activeBrand = 'news'; render(); };
  tabs.appendChild(newsBtn);

  const addBtn = document.createElement('button');
  addBtn.className = 'tab-btn' + (activeBrand === 'add' ? ' active' : '');
  addBtn.textContent = '+ Rajouter';
  addBtn.onclick = () => { activeBrand = 'add'; render(); };
  tabs.appendChild(addBtn);
}

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function formatDate(d){
  if (!d) return '';
  const s = String(d);
  let m = s.match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if (m) return `${m[1]}/${m[2]}/${m[3]}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return `${m[3]}/${m[2]}/${m[1]}`;
  return s;
}

// Clé de tri comparable quel que soit le format stocké (jj-mm-aaaa ou aaaa-mm-jj)
function dateKey(d){
  if (!d) return '';
  const s = String(d);
  let m = s.match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if (m) return `${m[3]}${m[2]}${m[1]}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return `${m[1]}${m[2]}${m[3]}`;
  return s;
}

function allNewsSorted(){
  let all = [];
  BRAND_ORDER.forEach(key => {
    const b = DATA.brands[key];
    if (!b) return;
    (b.news||[]).forEach(n => all.push({ ...n, brand: b.label }));
  });
  return all.sort((a,b) => dateKey(b.date).localeCompare(dateKey(a.date)));
}

function priceNewDisplay(w){
  if (!w.priceNew || w.priceNew === '—' || /préciser|vérifier|inconnu/i.test(w.priceNew)){
    const reason = w.priceNewReason ? ` <span class="price-reason">(${escapeHtml(w.priceNewReason)})</span>` : '';
    return '<span class="price-unknown">inconnu</span>' + reason;
  }
  return escapeHtml(w.priceNew);
}

function watchCard(w, idx){
  const div = document.createElement('div');
  div.className = 'card';
  const hasUsed = w.priceUsed && w.priceUsed !== '—';
  const v = w.variants;
  const hasVariants = v && (Array.isArray(v) ? v.length > 0 : ((v.tailles||[]).length + (v.couleurs||[]).length + (v.matieres||[]).length) > 0);
  const vid = 'variants-' + idx;

  function variantsGroupsHtml(){
    if (Array.isArray(v)) return v.map(x => `<span>${escapeHtml(x)}</span>`).join('');
    let html = '';
    if (v.tailles && v.tailles.length) html += `<div class="variant-group"><b>Tailles</b>${v.tailles.map(x=>`<span>${escapeHtml(x)}</span>`).join('')}</div>`;
    if (v.couleurs && v.couleurs.length) html += `<div class="variant-group"><b>Couleurs</b>${v.couleurs.map(x=>`<span>${escapeHtml(x)}</span>`).join('')}</div>`;
    if (v.matieres && v.matieres.length) html += `<div class="variant-group"><b>Matières</b>${v.matieres.map(x=>`<span>${escapeHtml(x)}</span>`).join('')}</div>`;
    return html;
  }
  function variantsCount(){
    if (Array.isArray(v)) return v.length;
    return (v.tailles||[]).length + (v.couleurs||[]).length + (v.matieres||[]).length;
  }

  const specsHtml = `
    <div class="specs">
      ${w.movement ? `<div class="spec"><b>Mouvement</b>${escapeHtml(w.movement)}</div>` : ''}
      ${w.diameter ? `<div class="spec"><b>Diamètre</b>${escapeHtml(w.diameter)}</div>` : ''}
      ${w.bracelet ? `<div class="spec"><b>Bracelet</b>${escapeHtml(w.bracelet)}</div>` : ''}
      ${w.releaseYear ? `<div class="spec"><b>Année</b>${escapeHtml(w.releaseYear)}</div>` : ''}
    </div>`;

  div.innerHTML = `
    <div class="card-top">
      <div>
        <div class="card-model">${escapeHtml(w.model)}${w.estimated ? '<span class="flag">estimation</span>' : ''}${w.perso ? '<span class="flag" style="border-color:var(--sage);color:var(--sage);">perso</span>' : ''}</div>
        <div class="card-ref mono">${escapeHtml(w.reference || '—')}</div>
      </div>
    </div>
    <div class="price-row">
      <div class="price-block">
        <span class="price-label">Neuf</span>
        <span class="price-new-val mono">${priceNewDisplay(w)}</span>
      </div>
      ${hasUsed ? `<div class="price-block"><span class="price-label">Occasion</span><span class="price-used-val mono">${escapeHtml(w.priceUsed)}</span></div>` : ''}
    </div>
    <div class="price-date">${escapeHtml(w.priceDate || '')}</div>
    ${specsHtml}
    ${w.note ? `<div class="card-note">${escapeHtml(w.note)}</div>` : ''}
    ${w.promos && w.promos.length ? `
      <div class="promos">
        <div class="promos-label">Bons plans repérés (sites tiers)</div>
        ${w.promos.map(p => `<div class="promo-row"><a href="${escapeHtml(p.link)}" target="_blank" rel="noopener">${escapeHtml(p.site)}</a><span class="promo-price mono">${escapeHtml(p.price)}</span></div>`).join('')}
        <div class="promos-disclaimer">Sites non officiels — vérifie toujours le vendeur (avis, ancienneté, retours) avant d'acheter.</div>
      </div>
    ` : ''}
    ${w.perso ? `<button class="variants-toggle" data-remove-custom="${w.brand}|${w.id}" style="color:var(--copper-deep) !important;">✕ Retirer cette entrée perso</button>` : ''}
    <div class="card-actions">
      ${w.link ? `<a href="${escapeHtml(w.link)}" target="_blank" rel="noopener">Voir la source ↗</a>` : ''}
      ${hasVariants ? `<button class="variants-toggle" data-toggle="${vid}">Voir les variantes (${variantsCount()})</button>` : ''}
    </div>
    ${hasVariants ? `<div class="variants-list" id="${vid}">${variantsGroupsHtml()}</div>` : ''}
  `;
  return div;
}

function trendCard(t){
  const div = document.createElement('div');
  div.className = 'trend-card';
  div.innerHTML = `
    <div class="trend-top">
      <div>
        <div class="trend-brand">${escapeHtml(t.brand)}</div>
        <div class="trend-model">${escapeHtml(t.model)}</div>
      </div>
      ${t.priceRange ? `<div class="trend-price mono">${escapeHtml(t.priceRange)}</div>` : ''}
    </div>
    ${t.note ? `<div class="trend-note">${escapeHtml(t.note)}</div>` : ''}
    <div class="trend-date mono">${escapeHtml(formatDate(t.date))}${t.link ? ` · <a href="${escapeHtml(t.link)}" target="_blank" rel="noopener" style="color:var(--ink-soft)">source ↗</a>` : ''}</div>
  `;
  return div;
}

function render(){
  renderTabs();
  const main = document.getElementById('main');
  main.innerHTML = "";
  const syncLine = document.getElementById('sync-line');
  syncLine.textContent = DATA.updated ? `Données du ${DATA.updated}` : '';

  if (activeBrand === 'trending'){
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML = `<div class="section-title"><h2>À la mode en ce moment</h2></div>
      <div style="font-size:12px;color:var(--ink-faint);font-family:-apple-system,sans-serif;margin-bottom:14px;line-height:1.5;">Micro-marques, indépendants et maisons méconnues qui font parler d'elles — pour découvrir autre chose que les grands noms.</div>`;
    const trending = (DATA.trending || []).slice().sort((a,b) => dateKey(b.date).localeCompare(dateKey(a.date)));
    if (trending.length === 0){
      panel.innerHTML += `<div class="empty">Rien pour l'instant.</div>`;
    } else {
      trending.forEach(t => panel.appendChild(trendCard(t)));
    }
    main.appendChild(panel);
    return;
  }

  if (activeBrand === 'add'){
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML = `<div class="section-title"><h2>Rajouter une montre</h2></div>
      <div style="font-size:12px;color:var(--ink-faint);font-family:-apple-system,sans-serif;margin-bottom:12px;line-height:1.5;">Ajout local (visible seulement sur cet appareil) — apparaît dans l'onglet de la marque choisie, marqué "perso".</div>`;

    const form = document.createElement('div');
    form.className = 'add-form';
    const brandOptions = BRAND_ORDER.filter(k => DATA.brands[k]).map(k => `<option value="${k}">${DATA.brands[k].label}</option>`).join('');
    const custom0 = loadCustom();
    const customBrandKeys = Object.keys(custom0).filter(k => !BRAND_ORDER.includes(k));
    const customBrandOptions = customBrandKeys.map(k => `<option value="${k}">${escapeHtml(k)}</option>`).join('');
    form.innerHTML = `
      <label>Marque</label>
      <select id="af-brand">${brandOptions}${customBrandOptions}<option value="__new__">+ Nouvelle marque…</option></select>
      <input type="text" id="af-brand-new" placeholder="Nom de la nouvelle marque" style="display:none; margin-top:6px;">
      <label>Modèle *</label>
      <input type="text" id="af-model" placeholder="ex: Seamaster Aqua Terra">
      <label>Référence</label>
      <input type="text" id="af-ref" placeholder="ex: 220.10.41.21.03.001">
      <label>Mouvement</label>
      <input type="text" id="af-movement" placeholder="ex: Automatique">
      <label>Diamètre</label>
      <input type="text" id="af-diameter" placeholder="ex: 41 mm">
      <label>Bracelet</label>
      <input type="text" id="af-bracelet" placeholder="ex: Acier">
      <label>Année de sortie</label>
      <input type="text" id="af-year" placeholder="ex: 2024">
      <label>Prix neuf</label>
      <input type="text" id="af-pricenew" placeholder="ex: 5 200 € (laisse vide si inconnu)">
      <label>Si prix neuf inconnu — pourquoi ?</label>
      <input type="text" id="af-pricereason" placeholder="ex: modèle discontinué, tarif non publié">
      <label>Prix occasion</label>
      <input type="text" id="af-priceused" placeholder="ex: 3 500 – 4 200 €">
      <label>Lien</label>
      <input type="text" id="af-link" placeholder="https://...">
      <label>Note</label>
      <textarea id="af-note" placeholder="Détails, contexte, pourquoi tu la suis..."></textarea>
      <button class="btn-submit" id="af-submit">Ajouter</button>
    `;
    panel.appendChild(form);

    const custom = loadCustom();
    const allCustom = [];
    Object.keys(custom).forEach(b => (custom[b]||[]).forEach(w => allCustom.push({...w, brand: b})));
    if (allCustom.length){
      const listTitle = document.createElement('div');
      listTitle.className = 'section-title';
      listTitle.style.marginTop = '20px';
      listTitle.innerHTML = `<h2>Tes ajouts perso</h2>`;
      panel.appendChild(listTitle);
      allCustom.forEach(w => {
        const row = document.createElement('div');
        row.className = 'add-list-item';
        row.innerHTML = `<span>${escapeHtml(w.model)} — ${escapeHtml(DATA.brands[w.brand] ? DATA.brands[w.brand].label : w.brand)}</span><button data-remove-custom="${w.brand}|${w.id}" style="background:none;border:none;color:var(--copper-deep);cursor:pointer;font-size:12px;">✕</button>`;
        panel.appendChild(row);
      });
    }

    main.appendChild(panel);

    document.getElementById('af-brand').onchange = (e) => {
      document.getElementById('af-brand-new').style.display = e.target.value === '__new__' ? 'block' : 'none';
    };

    document.getElementById('af-submit').onclick = () => {
      const model = document.getElementById('af-model').value.trim();
      if (!model){ toast('Le modèle est requis'); return; }
      let brand = document.getElementById('af-brand').value;
      if (brand === '__new__'){
        const newName = document.getElementById('af-brand-new').value.trim();
        if (!newName){ toast('Indique le nom de la nouvelle marque'); return; }
        brand = newName.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
      }
      const entry = {
        id: 'perso-' + Date.now(),
        perso: true,
        model,
        reference: document.getElementById('af-ref').value.trim(),
        movement: document.getElementById('af-movement').value.trim(),
        diameter: document.getElementById('af-diameter').value.trim(),
        bracelet: document.getElementById('af-bracelet').value.trim(),
        releaseYear: document.getElementById('af-year').value.trim(),
        priceNew: document.getElementById('af-pricenew').value.trim() || 'inconnu',
        priceNewReason: document.getElementById('af-pricereason').value.trim(),
        priceUsed: document.getElementById('af-priceused').value.trim(),
        priceDate: new Date().toLocaleDateString('fr-FR', {month:'long', year:'numeric'}),
        link: document.getElementById('af-link').value.trim(),
        note: document.getElementById('af-note').value.trim(),
        variants: []
      };
      const c = loadCustom();
      if (!c[brand]) c[brand] = [];
      c[brand].push(entry);
      saveCustom(c);
      if (document.getElementById('af-brand').value === '__new__'){
        const labels = loadCustomBrandLabels();
        labels[brand] = document.getElementById('af-brand-new').value.trim();
        saveCustomBrandLabels(labels);
      }
      toast('Montre ajoutée');
      activeBrand = brand;
      render();
    };

    panel.querySelectorAll('[data-remove-custom]').forEach(btn => {
      btn.onclick = () => {
        const [brand, id] = btn.getAttribute('data-remove-custom').split('|');
        const c = loadCustom();
        c[brand] = (c[brand]||[]).filter(w => w.id !== id);
        saveCustom(c);
        render();
      };
    });
    return;
  }

  if (activeBrand === 'news'){
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML = `<div class="section-title"><h2>Toutes les nouveautés</h2></div>`;
    const all = allNewsSorted();
    if (all.length === 0){
      panel.innerHTML += `<div class="empty">Rien pour l'instant.</div>`;
    } else {
      all.forEach(n => {
        const item = document.createElement('div');
        item.className = 'news-item';
        item.innerHTML = `<div class="news-date">${escapeHtml(formatDate(n.date))} · ${escapeHtml(n.brand)}</div><div class="news-text">${escapeHtml(n.text)}</div>${n.link ? `<div class="news-source"><a href="${escapeHtml(n.link)}" target="_blank" rel="noopener">Voir la source ↗</a></div>` : ''}`;
        panel.appendChild(item);
      });
    }
    main.appendChild(panel);
    return;
  }

  const brandData = DATA.brands[activeBrand] || { label: brandLabel(activeBrand), watches: [], news: [] };
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<div class="section-title"><h2>${escapeHtml(brandData.label)}</h2><span class="count">${(brandData.watches||[]).length} suivie${(brandData.watches||[]).length>1?'s':''}</span></div>`;

  const news = (brandData.news||[]).slice().sort((a,b) => dateKey(b.date).localeCompare(dateKey(a.date)));
  const newsBox = document.createElement('div');
  newsBox.className = 'brand-news';
  let newsHtml = `<div class="eyebrow">Actus ${escapeHtml(brandData.label)}</div>`;
  if (news.length === 0){
    newsHtml += `<div class="news-text">Rien pour l'instant.</div>`;
  } else {
    news.forEach(n => {
      newsHtml += `<div class="news-item"><div class="news-date">${escapeHtml(formatDate(n.date))}</div><div class="news-text">${escapeHtml(n.text)}</div>${n.link ? `<div class="news-source"><a href="${escapeHtml(n.link)}" target="_blank" rel="noopener">Voir la source ↗</a></div>` : ''}</div>`;
    });
  }
  newsBox.innerHTML = newsHtml;
  panel.appendChild(newsBox);

  const custom = loadCustom();
  const personalWatches = (custom[activeBrand] || []).map(w => ({...w, brand: activeBrand}));
  const watches = (brandData.watches || []).concat(personalWatches);
  if (watches.length === 0){
    panel.innerHTML += `<div class="empty">Aucune montre suivie pour cette marque pour l'instant.</div>`;
  } else {
    watches.forEach((w, i) => panel.appendChild(watchCard(w, activeBrand + '-' + i)));
  }
  main.appendChild(panel);

  panel.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.onclick = () => {
      const el = document.getElementById(btn.getAttribute('data-toggle'));
      el.classList.toggle('open');
    };
  });
  panel.querySelectorAll('[data-remove-custom]').forEach(btn => {
    btn.onclick = () => {
      const [brand, id] = btn.getAttribute('data-remove-custom').split('|');
      const c = loadCustom();
      c[brand] = (c[brand]||[]).filter(w => w.id !== id);
      saveCustom(c);
      render();
    };
  });
}

document.getElementById('btn-reload').onclick = async () => {
  toast('Rechargement…');
  const ok = await loadData(true);
  render();
  toast(ok ? 'Données rechargées' : 'Hors ligne — dernière version en cache');
};

document.getElementById('btn-claude').onclick = () => {
  const prompt = "Actualise le répertoire horloger (repo Lapepite792/repertoire-horloger). Commence par lire source_occasion.json : il liste les sites à utiliser pour les prix d'occasion et les bons plans, avec les règles à suivre. Ensuite, pour Omega, Tissot, LIP et Orient sur les modèles déjà suivis dans data.json, recherche 1) les dernières actualités avec leur lien source, 2) les prix neuf + fourchette occasion en croisant au moins deux sites de source_occasion.json — si un prix neuf est inconnu, renseigne priceNewReason avec la raison, 3) les caractéristiques (mouvement, diamètre, bracelet, année), 4) les variantes classées par tailles/couleurs/matières, 5) des bons plans issus des sites de source_occasion.json (avec lien). Actualise aussi l'onglet tendances — il doit servir à DÉCOUVRIR : privilégie les micro-marques, marques indépendantes et maisons méconnues ou relancées (pas Rolex/Patek/AP/Cartier). Mets à jour data.json directement (nouveautés triées les plus récentes en premier, dates stockées au format JJ-MM-AAAA).";
  navigator.clipboard.writeText(prompt).then(() => {
    toast('Prompt copié — colle-le à Claude');
  }).catch(() => {
    toast('Copie impossible sur ce navigateur');
  });
};

(async function init(){
  await loadData(false);
  render();
})();
</script>
</body>

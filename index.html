<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Répertoire Horloger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d6dbdf">
<style>
  /* ————————————————————————————————————————————————
     Palette : cadran argenté soleillé + aiguilles bleuies
     (le bleuissage thermique des aiguilles, vrai geste horloger)
     ———————————————————————————————————————————————— */
  :root{
    --dial:        #d6dbdf;
    --dial-light:  #edf0f2;
    --dial-edge:   #bcc5cc;
    --ink:         #161c21;
    --ink-soft:    #4c565f;
    --ink-faint:   #8d99a3;
    --blued:       #2b4a8f;
    --blued-deep:  #1b3266;
    --chrono:      #a1372b;
    --lume:        #cbd6c4;

    --display: ui-sans-serif, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    --body: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    --data: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #f2f5f6 0%, transparent 60%),
      conic-gradient(from 0deg at 50% 22%,
        rgba(255,255,255,.55) 0deg, rgba(255,255,255,0) 18deg,
        rgba(255,255,255,.45) 40deg, rgba(255,255,255,0) 62deg,
        rgba(255,255,255,.55) 84deg, rgba(255,255,255,0) 106deg,
        rgba(255,255,255,.45) 128deg, rgba(255,255,255,0) 150deg,
        rgba(255,255,255,.55) 172deg, rgba(255,255,255,0) 194deg,
        rgba(255,255,255,.45) 216deg, rgba(255,255,255,0) 238deg,
        rgba(255,255,255,.55) 260deg, rgba(255,255,255,0) 282deg,
        rgba(255,255,255,.45) 304deg, rgba(255,255,255,0) 326deg,
        rgba(255,255,255,.55) 348deg, rgba(255,255,255,0) 360deg),
      var(--dial);
    color: var(--ink);
    font-family: var(--body);
    min-height:100vh;
    padding-bottom:56px;
    -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family: var(--data); font-variant-numeric: tabular-nums; }

  /* ——— Signature : le chemin de fer (minute track) ——— */
  .railroad{
    height:9px;
    background:
      repeating-linear-gradient(90deg, var(--ink-faint) 0 1px, transparent 1px 5px);
    opacity:.55;
    position:relative;
  }
  .railroad::after{
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(90deg, var(--ink) 0 1.5px, transparent 1.5px 25px);
    opacity:.9;
  }

  /* ——— En-tête ——— */
  header{ padding:30px 20px 0; }
  .maker{
    font-family: var(--display);
    font-size:9.5px; letter-spacing:.34em; text-transform:uppercase;
    color: var(--blued); font-weight:600; margin-bottom:14px;
  }
  h1{
    font-family: var(--display);
    font-size: clamp(19px, 5.4vw, 25px);
    font-weight:600; letter-spacing:.2em; text-transform:uppercase;
    margin:0; line-height:1.25;
  }
  h1 span{ display:block; color: var(--ink-faint); font-weight:400; letter-spacing:.3em; font-size:.52em; margin-top:7px; }
  .tagline{
    color: var(--ink-soft); font-size:12.5px; line-height:1.6;
    max-width:460px; margin:14px 0 0;
  }
  .header-actions{ display:flex; gap:8px; margin:16px 0 14px; flex-wrap:wrap; }
  .hbtn{
    background: var(--dial-light); border:1px solid var(--ink); color: var(--ink);
    font-family: var(--display); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
    font-weight:600; padding:9px 14px; cursor:pointer; border-radius:2px;
    transition: background .15s, color .15s;
  }
  .hbtn:hover{ background: var(--ink); color: var(--dial-light); }
  .hbtn:focus-visible{ outline:2px solid var(--blued); outline-offset:2px; }
  .sync-line{
    font-size:10px; letter-spacing:.1em; color: var(--ink-faint);
    text-transform:uppercase; padding:0 20px 14px;
  }

  /* ——— Onglets : index appliqués ——— */
  nav.tabs{
    display:flex; gap:0; padding:0 14px; overflow-x:auto;
    border-bottom:1px solid var(--ink);
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    position:relative; background:none; border:none; cursor:pointer;
    font-family: var(--display); font-size:10.5px; letter-spacing:.13em;
    text-transform:uppercase; font-weight:600; color: var(--ink-faint);
    padding:15px 13px 13px; white-space:nowrap;
    transition: color .15s;
  }
  .tab-btn:hover{ color: var(--ink-soft); }
  .tab-btn.active{ color: var(--blued-deep); }
  .tab-btn.active::before{
    content:""; position:absolute; left:50%; top:5px; transform:translateX(-50%);
    width:16px; height:4px; background: var(--blued);
    clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%);
  }
  .tab-btn:focus-visible{ outline:2px solid var(--blued); outline-offset:-3px; }

  main{ padding:20px 16px 0; max-width:660px; margin:0 auto; }
  .panel{ animation: settle .28s cubic-bezier(.22,.8,.3,1); }
  @keyframes settle{ from{ opacity:0; transform:translateY(5px);} to{ opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .panel{ animation:none; } }

  .section-title{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:6px 0 14px; }
  .section-title h2{
    font-family: var(--display); font-size:14px; font-weight:600;
    letter-spacing:.18em; text-transform:uppercase; margin:0;
  }
  .section-title .count{
    font-family: var(--data); font-size:10px; color: var(--ink-faint);
    letter-spacing:.08em; white-space:nowrap;
  }
  .lede{ font-size:12.5px; color: var(--ink-soft); line-height:1.6; margin:-6px 0 16px; }

  /* ——— Actus ——— */
  .brand-news{
    border-top:1.5px solid var(--ink); padding:14px 0 4px; margin-bottom:20px;
  }
  .eyebrow{
    font-family: var(--display); font-size:9px; letter-spacing:.26em;
    text-transform:uppercase; color: var(--blued); font-weight:600; margin-bottom:12px;
  }
  .news-item{ display:grid; grid-template-columns:auto 1fr; gap:0 14px; margin-bottom:14px; }
  .news-date{
    font-family: var(--data); font-size:10px; color: var(--ink-faint);
    letter-spacing:.04em; padding-top:2px; white-space:nowrap;
    border-right:1px solid var(--dial-edge); padding-right:14px; margin-right:-14px;
  }
  .news-text{ font-size:12.5px; color: var(--ink-soft); line-height:1.6; }
  .news-source{ grid-column:2; font-size:11px; margin-top:5px; }
  .news-source a{ color: var(--blued); text-decoration:none; border-bottom:1px solid rgba(43,74,143,.3); }
  .news-source a:hover{ border-bottom-color: var(--blued); }

  /* ——— Fiches montres ——— */
  .card{
    background: var(--dial-light);
    border:1px solid var(--dial-edge);
    border-radius:3px; padding:0 0 14px; margin-bottom:14px;
    box-shadow: 0 1px 2px rgba(22,28,33,.05);
  }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:15px 16px 0; }
  .card-model{ font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.3; }
  .card-ref{
    font-family: var(--data); font-size:10px; color: var(--ink-faint);
    letter-spacing:.06em; margin-top:4px;
  }
  .flag{
    display:inline-block; font-family: var(--display); font-size:8px;
    letter-spacing:.14em; text-transform:uppercase; font-weight:600;
    color: var(--ink-faint); border:1px solid var(--dial-edge);
    padding:2px 7px; border-radius:2px; margin-left:8px; vertical-align:middle;
  }

  /* le prix : lecture d'instrument */
  .price-row{
    display:flex; align-items:stretch; gap:0; margin:14px 16px 0;
    border-top:1px solid var(--dial-edge); border-bottom:1px solid var(--dial-edge);
  }
  .price-block{ padding:11px 16px 11px 0; }
  .price-block + .price-block{ padding-left:16px; border-left:1px solid var(--dial-edge); }
  .price-label{
    display:block; font-family: var(--display); font-size:8.5px;
    letter-spacing:.2em; text-transform:uppercase; color: var(--ink-faint);
    margin-bottom:4px;
  }
  .price-new-val{
    font-family: var(--data); font-variant-numeric: tabular-nums;
    font-size: clamp(15px, 4.6vw, 19px); font-weight:600; color: var(--blued-deep);
    line-height:1.1; display:block;
  }
  .price-used-val{
    font-family: var(--data); font-variant-numeric: tabular-nums;
    font-size: clamp(12.5px, 3.6vw, 14.5px); font-weight:500; color: var(--ink-soft);
    line-height:1.1; display:block;
  }
  .price-unknown{ color: var(--ink-faint); font-style:italic; font-weight:400; }
  .price-reason{ font-family: var(--body); font-size:10.5px; color: var(--ink-faint); font-style:italic; }
  .price-date{
    font-family: var(--data); font-size:9.5px; color: var(--ink-faint);
    letter-spacing:.06em; margin:7px 16px 0;
  }

  /* fiche technique */
  .specs{
    display:grid; grid-template-columns:repeat(2, minmax(0,1fr));
    gap:0; margin:14px 16px 0;
    border-top:1px solid var(--dial-edge);
  }
  .spec{
    font-size:12px; color: var(--ink); padding:10px 12px 10px 0;
    border-bottom:1px solid var(--dial-edge);
  }
  .spec:nth-child(odd){ border-right:1px solid var(--dial-edge); }
  .spec:nth-child(even){ padding-left:12px; }
  .spec b{
    display:block; font-family: var(--display); font-size:8px;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ink-faint);
    font-weight:600; margin-bottom:3px;
  }

  .card-note{ font-size:12.5px; color: var(--ink-soft); line-height:1.65; margin:13px 16px 0; }

  /* bons plans */
  .promos{ margin:14px 16px 0; padding-top:12px; border-top:1px solid var(--dial-edge); }
  .promos-label{
    font-family: var(--display); font-size:8.5px; letter-spacing:.2em;
    text-transform:uppercase; color: var(--ink-faint); margin-bottom:8px;
  }
  .promo-row{
    display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    font-size:12px; padding:5px 0; border-bottom:1px dotted var(--dial-edge);
  }
  .promo-row:last-of-type{ border-bottom:none; }
  .promo-row a{ color: var(--ink); text-decoration:none; border-bottom:1px solid var(--dial-edge); }
  .promo-row a:hover{ border-bottom-color: var(--blued); color: var(--blued); }
  .promo-price{ color: var(--blued-deep); font-weight:600; white-space:nowrap; }
  .promos-disclaimer{ font-size:10px; color: var(--ink-faint); font-style:italic; margin-top:8px; line-height:1.5; }

  /* actions + variantes */
  .card-actions{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin:14px 16px 0; }
  .card-actions a{
    font-size:11px; color: var(--ink-soft); text-decoration:none;
    border-bottom:1px solid var(--dial-edge);
  }
  .card-actions a:hover{ color: var(--blued); border-bottom-color: var(--blued); }
  .variants-toggle{
    background:none; border:none; padding:0; cursor:pointer;
    font-family: var(--display); font-size:9px; letter-spacing:.14em;
    text-transform:uppercase; font-weight:600; color: var(--blued);
  }
  .variants-toggle:hover{ color: var(--blued-deep); }
  .variants-toggle:focus-visible{ outline:2px solid var(--blued); outline-offset:3px; }
  .variants-list{
    display:none; margin:12px 16px 0; padding:12px 14px;
    background: var(--dial); border-left:2px solid var(--blued);
  }
  .variants-list.open{ display:block; }
  .variant-group{ margin-bottom:11px; }
  .variant-group:last-child{ margin-bottom:0; }
  .variant-group b{
    display:block; font-family: var(--display); font-size:8px;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ink-faint);
    font-weight:600; margin-bottom:6px;
  }
  .variants-list span{
    display:inline-block; font-size:11px; color: var(--ink);
    background: var(--dial-light); border:1px solid var(--dial-edge);
    padding:4px 9px; border-radius:2px; margin:0 5px 5px 0;
  }

  /* ——— À la mode ——— */
  .trend-card{
    background: var(--dial-light); border:1px solid var(--dial-edge);
    border-radius:3px; padding:14px 16px; margin-bottom:12px;
    border-left:3px solid var(--blued);
  }
  .trend-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .trend-brand{
    font-family: var(--display); font-size:9px; letter-spacing:.22em;
    text-transform:uppercase; color: var(--blued); font-weight:600;
  }
  .trend-model{ font-size:16px; font-weight:600; margin-top:4px; line-height:1.3; }
  .trend-price{
    font-family: var(--data); font-size:11px; color: var(--ink-soft);
    text-align:right; font-weight:500; flex-shrink:0;
  }
  .trend-note{ font-size:12.5px; color: var(--ink-soft); line-height:1.65; margin-top:9px; }
  .trend-date{
    font-family: var(--data); font-size:9.5px; color: var(--ink-faint);
    margin-top:10px; letter-spacing:.06em;
  }
  .trend-date a{ color: var(--ink-soft); }

  /* ——— Formulaire ——— */
  .add-form{
    background: var(--dial-light); border:1px solid var(--dial-edge);
    border-radius:3px; padding:18px;
  }
  .add-form label{
    display:block; font-family: var(--display); font-size:8.5px;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ink-faint);
    font-weight:600; margin:15px 0 5px;
  }
  .add-form label:first-child{ margin-top:0; }
  .add-form input, .add-form select, .add-form textarea{
    width:100%; background: var(--dial); border:1px solid var(--dial-edge);
    color: var(--ink); padding:10px 11px; font-size:13px;
    font-family: var(--body); border-radius:2px;
  }
  .add-form input:focus, .add-form select:focus, .add-form textarea:focus{
    outline:none; border-color: var(--blued); box-shadow:0 0 0 2px rgba(43,74,143,.14);
  }
  .add-form textarea{ min-height:54px; resize:vertical; }
  .btn-submit{
    margin-top:20px; width:100%; background: var(--ink); color: var(--dial-light);
    border:none; padding:13px; cursor:pointer;
    font-family: var(--display); font-size:10px; letter-spacing:.2em;
    text-transform:uppercase; font-weight:600; border-radius:2px;
  }
  .btn-submit:hover{ background: var(--blued-deep); }
  .add-list-item{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    font-size:12.5px; color: var(--ink-soft); padding:11px 0;
    border-bottom:1px solid var(--dial-edge);
  }

  .radar-filter{ display:flex; gap:6px; margin:0 0 20px; flex-wrap:wrap; }
  .filter-btn{
    background:none; border:1px solid var(--dial-edge); color: var(--ink-faint);
    font-family: var(--display); font-size:8.5px; letter-spacing:.16em;
    text-transform:uppercase; font-weight:600; padding:7px 12px;
    cursor:pointer; border-radius:2px; transition:.15s;
  }
  .filter-btn:hover{ color: var(--ink); border-color: var(--ink-faint); }
  .filter-btn.on{ background: var(--blued); border-color: var(--blued); color:#fff; }
  .filter-btn:focus-visible{ outline:2px solid var(--blued); outline-offset:2px; }

  .release{
    display:grid; grid-template-columns:auto 1fr; gap:0 16px;
    padding:16px 0; border-bottom:1px solid var(--dial-edge);
  }
  .release:first-of-type{ border-top:1.5px solid var(--ink); }
  .release-date{
    font-size:10px; color: var(--ink-faint); letter-spacing:.04em;
    padding-top:3px; white-space:nowrap;
  }
  .release-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .release-brand{
    font-family: var(--display); font-size:9.5px; letter-spacing:.2em;
    text-transform:uppercase; font-weight:600; color: var(--blued);
  }
  .release-tag{
    font-family: var(--display); font-size:7.5px; letter-spacing:.14em;
    text-transform:uppercase; font-weight:600; color: var(--ink-faint);
    border:1px solid var(--dial-edge); padding:2px 6px; border-radius:2px;
  }
  .release-model{ font-size:15px; font-weight:600; margin:4px 0 6px; line-height:1.3; }
  .release-foot{ display:flex; align-items:baseline; gap:14px; margin-top:8px; flex-wrap:wrap; }
  .release-price{ font-size:11.5px; font-weight:600; color: var(--ink-soft); }
  .release-foot a{
    font-size:11px; color: var(--blued); text-decoration:none;
    border-bottom:1px solid rgba(43,74,143,.3);
  }
  .release-foot a:hover{ border-bottom-color: var(--blued); }

  .load-error{
    background: var(--dial-light); border:1px solid var(--dial-edge);
    border-left:3px solid var(--chrono); border-radius:3px; padding:18px 18px 4px;
  }
  .load-error p{ font-size:12.5px; color: var(--ink-soft); line-height:1.65; margin:0 0 12px; }
  .load-error code{ font-family: var(--data); font-size:11.5px; background: var(--dial); padding:1px 5px; border-radius:2px; }
  .load-error a{ color: var(--blued); }

  .empty{
    text-align:center; color: var(--ink-faint); font-size:12px;
    padding:28px 14px; border:1px dashed var(--dial-edge); border-radius:3px;
    font-family: var(--display); letter-spacing:.1em; text-transform:uppercase;
  }
  .footer-note{
    text-align:center; font-size:9.5px; color: var(--ink-faint);
    padding:32px 20px 12px; letter-spacing:.12em; text-transform:uppercase;
    font-family: var(--display);
  }

  #toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(6px);
    background: var(--ink); color: var(--dial-light);
    font-family: var(--display); font-size:10px; letter-spacing:.16em;
    text-transform:uppercase; font-weight:600;
    padding:11px 20px; border-radius:2px; opacity:0; pointer-events:none;
    transition: opacity .2s, transform .2s;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::selection{ background: var(--blued); color:#fff; }
</style>
</head>
<body>

<header>
  <div class="maker">Besançon · Le Locle · Akita</div>
  <h1>Répertoire Horloger<span>Suivi personnel</span></h1>
  <p class="tagline">Prix relevés, caractéristiques et nouveautés pour les marques suivies. Mis à jour à la demande.</p>
  <div class="header-actions">
    <button class="hbtn" id="btn-reload">↻ Recharger</button>
    <button class="hbtn" id="btn-claude">Demander à Claude</button>
  </div>
</header>
<div class="railroad"></div>
<div class="sync-line mono" id="sync-line"></div>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div class="footer-note">Répertoire personnel — actualisation manuelle via Claude.</div>
<div id="toast"></div>

<script>
const DATA_URL = 'data.json';
const BRAND_ORDER = ["omega", "tissot", "lip", "orient"];
let DATA = null;
let activeBrand = "omega";
let newsFilter = 'all';

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function loadData(forceFresh){
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    DATA = await res.json();
    localStorage.setItem('watch-tracker:cache', JSON.stringify(DATA));
    return true;
  } catch(e){
    const cached = localStorage.getItem('watch-tracker:cache');
    if (cached){ DATA = JSON.parse(cached); return false; }
    DATA = { updated: null, brands: {}, trending: [] };
    return false;
  }
}

// ---------- Ajouts personnels (stockés en local, jamais écrasés par une actualisation) ----------
function loadCustom(){
  try { return JSON.parse(localStorage.getItem('watch-tracker:custom') || '{}'); }
  catch(e){ return {}; }
}
function saveCustom(custom){
  localStorage.setItem('watch-tracker:custom', JSON.stringify(custom));
}
function loadCustomBrandLabels(){
  try { return JSON.parse(localStorage.getItem('watch-tracker:custom-brand-labels') || '{}'); }
  catch(e){ return {}; }
}
function saveCustomBrandLabels(labels){
  localStorage.setItem('watch-tracker:custom-brand-labels', JSON.stringify(labels));
}
function brandLabel(key){
  if (DATA.brands[key]) return DATA.brands[key].label;
  const labels = loadCustomBrandLabels();
  return labels[key] || key;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = "";

  const trendBtn = document.createElement('button');
  trendBtn.className = 'tab-btn' + (activeBrand === 'trending' ? ' active' : '');
  trendBtn.textContent = 'À la mode';
  trendBtn.onclick = () => { activeBrand = 'trending'; render(); };
  tabs.appendChild(trendBtn);

  const newsBtn = document.createElement('button');
  newsBtn.className = 'tab-btn' + (activeBrand === 'news' ? ' active' : '');
  newsBtn.textContent = 'Radar';
  newsBtn.onclick = () => { activeBrand = 'news'; render(); };
  tabs.appendChild(newsBtn);

  BRAND_ORDER.forEach(key => {
    if (!DATA.brands[key]) return;
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (key === activeBrand ? ' active' : '');
    btn.textContent = DATA.brands[key].label;
    btn.onclick = () => { activeBrand = key; render(); };
    tabs.appendChild(btn);
  });

  const custom = loadCustom();
  Object.keys(custom).filter(k => !BRAND_ORDER.includes(k) && (custom[k]||[]).length > 0).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (key === activeBrand ? ' active' : '');
    btn.textContent = brandLabel(key);
    btn.onclick = () => { activeBrand = key; render(); };
    tabs.appendChild(btn);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'tab-btn' + (activeBrand === 'add' ? ' active' : '');
  addBtn.textContent = '+ Rajouter';
  addBtn.onclick = () => { activeBrand = 'add'; render(); };
  tabs.appendChild(addBtn);
}

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function formatDate(d){
  if (!d) return '';
  const s = String(d);
  let m = s.match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if (m) return `${m[1]}/${m[2]}/${m[3]}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return `${m[3]}/${m[2]}/${m[1]}`;
  return s;
}

// Clé de tri comparable quel que soit le format stocké (jj-mm-aaaa ou aaaa-mm-jj)
function dateKey(d){
  if (!d) return '';
  const s = String(d);
  let m = s.match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if (m) return `${m[3]}${m[2]}${m[1]}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return `${m[1]}${m[2]}${m[3]}`;
  return s;
}

function allNewsSorted(){
  let all = [];
  // sorties toutes marques (le radar)
  (DATA.releases || []).forEach(r => all.push({ ...r, tracked:false }));
  // actus des marques suivies, repérées comme telles
  BRAND_ORDER.forEach(key => {
    const b = DATA.brands[key];
    if (!b) return;
    (b.news||[]).forEach(n => all.push({ ...n, brand: b.label, tracked:true }));
  });
  return all.sort((a,b) => dateKey(b.date).localeCompare(dateKey(a.date)));
}

function priceNewDisplay(w){
  if (!w.priceNew || w.priceNew === '—' || /préciser|vérifier|inconnu/i.test(w.priceNew)){
    const reason = w.priceNewReason ? ` <span class="price-reason">(${escapeHtml(w.priceNewReason)})</span>` : '';
    return '<span class="price-unknown">inconnu</span>' + reason;
  }
  return escapeHtml(w.priceNew);
}

function watchCard(w, idx){
  const div = document.createElement('div');
  div.className = 'card';
  const hasUsed = w.priceUsed && w.priceUsed !== '—';
  const v = w.variants;
  const hasVariants = v && (Array.isArray(v) ? v.length > 0 : ((v.tailles||[]).length + (v.couleurs||[]).length + (v.matieres||[]).length) > 0);
  const vid = 'variants-' + idx;

  function variantsGroupsHtml(){
    if (Array.isArray(v)) return v.map(x => `<span>${escapeHtml(x)}</span>`).join('');
    let html = '';
    if (v.tailles && v.tailles.length) html += `<div class="variant-group"><b>Tailles</b>${v.tailles.map(x=>`<span>${escapeHtml(x)}</span>`).join('')}</div>`;
    if (v.couleurs && v.couleurs.length) html += `<div class="variant-group"><b>Couleurs</b>${v.couleurs.map(x=>`<span>${escapeHtml(x)}</span>`).join('')}</div>`;
    if (v.matieres && v.matieres.length) html += `<div class="variant-group"><b>Matières</b>${v.matieres.map(x=>`<span>${escapeHtml(x)}</span>`).join('')}</div>`;
    return html;
  }
  function variantsCount(){
    if (Array.isArray(v)) return v.length;
    return (v.tailles||[]).length + (v.couleurs||[]).length + (v.matieres||[]).length;
  }

  const specsHtml = `
    <div class="specs">
      ${w.movement ? `<div class="spec"><b>Mouvement</b>${escapeHtml(w.movement)}</div>` : ''}
      ${w.diameter ? `<div class="spec"><b>Diamètre</b>${escapeHtml(w.diameter)}</div>` : ''}
      ${w.bracelet ? `<div class="spec"><b>Bracelet</b>${escapeHtml(w.bracelet)}</div>` : ''}
      ${w.releaseYear ? `<div class="spec"><b>Année</b>${escapeHtml(w.releaseYear)}</div>` : ''}
    </div>`;

  div.innerHTML = `
    <div class="card-top">
      <div>
        <div class="card-model">${escapeHtml(w.model)}${w.estimated ? '<span class="flag">estimation</span>' : ''}${w.perso ? '<span class="flag" style="border-color:var(--blued);color:var(--blued);">perso</span>' : ''}</div>
        <div class="card-ref mono">${escapeHtml(w.reference || '—')}</div>
      </div>
    </div>
    <div class="price-row">
      <div class="price-block">
        <span class="price-label">Neuf</span>
        <span class="price-new-val mono">${priceNewDisplay(w)}</span>
      </div>
      ${hasUsed ? `<div class="price-block"><span class="price-label">Occasion</span><span class="price-used-val mono">${escapeHtml(w.priceUsed)}</span></div>` : ''}
    </div>
    <div class="price-date">${escapeHtml(w.priceDate || '')}</div>
    ${specsHtml}
    ${w.note ? `<div class="card-note">${escapeHtml(w.note)}</div>` : ''}
    ${w.promos && w.promos.length ? `
      <div class="promos">
        <div class="promos-label">Bons plans repérés (sites tiers)</div>
        ${w.promos.map(p => `<div class="promo-row"><a href="${escapeHtml(p.link)}" target="_blank" rel="noopener">${escapeHtml(p.site)}</a><span class="promo-price mono">${escapeHtml(p.price)}</span></div>`).join('')}
        <div class="promos-disclaimer">Sites non officiels — vérifie toujours le vendeur (avis, ancienneté, retours) avant d'acheter.</div>
      </div>
    ` : ''}
    ${w.perso ? `<button class="variants-toggle" data-remove-custom="${w.brand}|${w.id}" style="color:var(--chrono) !important;">✕ Retirer cette entrée perso</button>` : ''}
    <div class="card-actions">
      ${w.link ? `<a href="${escapeHtml(w.link)}" target="_blank" rel="noopener">Voir la source ↗</a>` : ''}
      ${hasVariants ? `<button class="variants-toggle" data-toggle="${vid}">Voir les variantes (${variantsCount()})</button>` : ''}
    </div>
    ${hasVariants ? `<div class="variants-list" id="${vid}">${variantsGroupsHtml()}</div>` : ''}
  `;
  return div;
}

function trendCard(t){
  const div = document.createElement('div');
  div.className = 'trend-card';
  div.innerHTML = `
    <div class="trend-top">
      <div>
        <div class="trend-brand">${escapeHtml(t.brand)}</div>
        <div class="trend-model">${escapeHtml(t.model)}</div>
      </div>
      ${t.priceRange ? `<div class="trend-price mono">${escapeHtml(t.priceRange)}</div>` : ''}
    </div>
    ${t.note ? `<div class="trend-note">${escapeHtml(t.note)}</div>` : ''}
    <div class="trend-date mono">${escapeHtml(formatDate(t.date))}${t.link ? ` · <a href="${escapeHtml(t.link)}" target="_blank" rel="noopener" style="color:var(--ink-soft)">source ↗</a>` : ''}</div>
  `;
  return div;
}

function render(){
  renderTabs();
  const main = document.getElementById('main');
  main.innerHTML = "";
  const syncLine = document.getElementById('sync-line');
  syncLine.textContent = DATA.updated ? `Données du ${formatDate(DATA.updated)}` : 'Données indisponibles';

  // Aucune donnée chargée : expliquer quoi faire plutôt que d'afficher une page vide
  if (!DATA.brands || Object.keys(DATA.brands).length === 0){
    const isLocal = location.protocol === 'file:';
    main.innerHTML = `<div class="load-error">
      <div class="eyebrow">Données non chargées</div>
      <p>${isLocal
        ? "La page est ouverte depuis un fichier local, elle ne peut donc pas lire <code>data.json</code>."
        : "Le fichier <code>data.json</code> n'a pas pu être récupéré."}</p>
      <p>Ouvre le répertoire depuis <a href="https://lapepite792.github.io/repertoire-horloger/">lapepite792.github.io/repertoire-horloger</a>, ou place <code>data.json</code> dans le même dossier que cette page.</p>
    </div>`;
    return;
  }

  if (activeBrand === 'trending'){
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML = `<div class="section-title"><h2>À la mode en ce moment</h2></div>
      <div class="lede">Micro-marques, indépendants et maisons méconnues qui font parler d'elles — pour découvrir autre chose que les grands noms.</div>`;
    const trending = (DATA.trending || []).slice().sort((a,b) => dateKey(b.date).localeCompare(dateKey(a.date)));
    if (trending.length === 0){
      panel.innerHTML += `<div class="empty">Rien pour l'instant.</div>`;
    } else {
      trending.forEach(t => panel.appendChild(trendCard(t)));
    }
    main.appendChild(panel);
    return;
  }

  if (activeBrand === 'add'){
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML = `<div class="section-title"><h2>Rajouter une montre</h2></div>
      <div style="font-size:12px;color:var(--ink-faint);font-family:-apple-system,sans-serif;margin-bottom:12px;line-height:1.5;">Ajout local (visible seulement sur cet appareil) — apparaît dans l'onglet de la marque choisie, marqué "perso".</div>`;

    const form = document.createElement('div');
    form.className = 'add-form';
    const brandOptions = BRAND_ORDER.filter(k => DATA.brands[k]).map(k => `<option value="${k}">${DATA.brands[k].label}</option>`).join('');
    const custom0 = loadCustom();
    const customBrandKeys = Object.keys(custom0).filter(k => !BRAND_ORDER.includes(k));
    const customBrandOptions = customBrandKeys.map(k => `<option value="${k}">${escapeHtml(k)}</option>`).join('');
    form.innerHTML = `
      <label>Marque</label>
      <select id="af-brand">${brandOptions}${customBrandOptions}<option value="__new__">+ Nouvelle marque…</option></select>
      <input type="text" id="af-brand-new" placeholder="Nom de la nouvelle marque" style="display:none; margin-top:6px;">
      <label>Modèle *</label>
      <input type="text" id="af-model" placeholder="ex: Seamaster Aqua Terra">
      <label>Référence</label>
      <input type="text" id="af-ref" placeholder="ex: 220.10.41.21.03.001">
      <label>Mouvement</label>
      <input type="text" id="af-movement" placeholder="ex: Automatique">
      <label>Diamètre</label>
      <input type="text" id="af-diameter" placeholder="ex: 41 mm">
      <label>Bracelet</label>
      <input type="text" id="af-bracelet" placeholder="ex: Acier">
      <label>Année de sortie</label>
      <input type="text" id="af-year" placeholder="ex: 2024">
      <label>Prix neuf</label>
      <input type="text" id="af-pricenew" placeholder="ex: 5 200 € (laisse vide si inconnu)">
      <label>Si prix neuf inconnu — pourquoi ?</label>
      <input type="text" id="af-pricereason" placeholder="ex: modèle discontinué, tarif non publié">
      <label>Prix occasion</label>
      <input type="text" id="af-priceused" placeholder="ex: 3 500 – 4 200 €">
      <label>Lien</label>
      <input type="text" id="af-link" placeholder="https://...">
      <label>Note</label>
      <textarea id="af-note" placeholder="Détails, contexte, pourquoi tu la suis..."></textarea>
      <button class="btn-submit" id="af-submit">Ajouter</button>
    `;
    panel.appendChild(form);

    const custom = loadCustom();
    const allCustom = [];
    Object.keys(custom).forEach(b => (custom[b]||[]).forEach(w => allCustom.push({...w, brand: b})));
    if (allCustom.length){
      const listTitle = document.createElement('div');
      listTitle.className = 'section-title';
      listTitle.style.marginTop = '20px';
      listTitle.innerHTML = `<h2>Tes ajouts perso</h2>`;
      panel.appendChild(listTitle);
      allCustom.forEach(w => {
        const row = document.createElement('div');
        row.className = 'add-list-item';
        row.innerHTML = `<span>${escapeHtml(w.model)} — ${escapeHtml(DATA.brands[w.brand] ? DATA.brands[w.brand].label : w.brand)}</span><button data-remove-custom="${w.brand}|${w.id}" style="background:none;border:none;color:var(--chrono);cursor:pointer;font-size:12px;">✕</button>`;
        panel.appendChild(row);
      });
    }

    main.appendChild(panel);

    document.getElementById('af-brand').onchange = (e) => {
      document.getElementById('af-brand-new').style.display = e.target.value === '__new__' ? 'block' : 'none';
    };

    document.getElementById('af-submit').onclick = () => {
      const model = document.getElementById('af-model').value.trim();
      if (!model){ toast('Le modèle est requis'); return; }
      let brand = document.getElementById('af-brand').value;
      if (brand === '__new__'){
        const newName = document.getElementById('af-brand-new').value.trim();
        if (!newName){ toast('Indique le nom de la nouvelle marque'); return; }
        brand = newName.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
      }
      const entry = {
        id: 'perso-' + Date.now(),
        perso: true,
        model,
        reference: document.getElementById('af-ref').value.trim(),
        movement: document.getElementById('af-movement').value.trim(),
        diameter: document.getElementById('af-diameter').value.trim(),
        bracelet: document.getElementById('af-bracelet').value.trim(),
        releaseYear: document.getElementById('af-year').value.trim(),
        priceNew: document.getElementById('af-pricenew').value.trim() || 'inconnu',
        priceNewReason: document.getElementById('af-pricereason').value.trim(),
        priceUsed: document.getElementById('af-priceused').value.trim(),
        priceDate: new Date().toLocaleDateString('fr-FR', {month:'long', year:'numeric'}),
        link: document.getElementById('af-link').value.trim(),
        note: document.getElementById('af-note').value.trim(),
        variants: []
      };
      const c = loadCustom();
      if (!c[brand]) c[brand] = [];
      c[brand].push(entry);
      saveCustom(c);
      if (document.getElementById('af-brand').value === '__new__'){
        const labels = loadCustomBrandLabels();
        labels[brand] = document.getElementById('af-brand-new').value.trim();
        saveCustomBrandLabels(labels);
      }
      toast('Montre ajoutée');
      activeBrand = brand;
      render();
    };

    panel.querySelectorAll('[data-remove-custom]').forEach(btn => {
      btn.onclick = () => {
        const [brand, id] = btn.getAttribute('data-remove-custom').split('|');
        const c = loadCustom();
        c[brand] = (c[brand]||[]).filter(w => w.id !== id);
        saveCustom(c);
        render();
      };
    });
    return;
  }

  if (activeBrand === 'news'){
    const panel = document.createElement('div');
    panel.className = 'panel';
    const all = allNewsSorted();
    const nbBrands = new Set(all.map(n => n.brand)).size;
    panel.innerHTML = `
      <div class="section-title"><h2>Radar des sorties</h2><span class="count">${all.length} sorties · ${nbBrands} marques</span></div>
      <p class="lede">Toutes marques confondues, pas seulement celles que tu suis. Les plus récentes en tête.</p>
      <div class="radar-filter">
        <button class="filter-btn${newsFilter==='all'?' on':''}" data-filter="all">Tout</button>
        <button class="filter-btn${newsFilter==='tracked'?' on':''}" data-filter="tracked">Mes marques</button>
        <button class="filter-btn${newsFilter==='others'?' on':''}" data-filter="others">À découvrir</button>
      </div>`;

    const shown = all.filter(n =>
      newsFilter === 'all' ? true : newsFilter === 'tracked' ? n.tracked : !n.tracked);

    if (shown.length === 0){
      panel.innerHTML += `<div class="empty">Aucune sortie dans ce filtre</div>`;
    } else {
      shown.forEach(n => {
        const item = document.createElement('div');
        item.className = 'release';
        item.innerHTML = `
          <div class="release-date mono">${escapeHtml(formatDate(n.date))}</div>
          <div>
            <div class="release-head">
              <span class="release-brand">${escapeHtml(n.brand)}</span>
              ${n.tracked ? '<span class="release-tag">marque suivie</span>' : ''}
            </div>
            ${n.model ? `<div class="release-model">${escapeHtml(n.model)}</div>` : ''}
            <div class="news-text">${escapeHtml(n.text)}</div>
            <div class="release-foot">
              ${n.price ? `<span class="release-price mono">${escapeHtml(n.price)}</span>` : ''}
              ${n.link ? `<a href="${escapeHtml(n.link)}" target="_blank" rel="noopener">Voir la source ↗</a>` : ''}
            </div>
          </div>`;
        panel.appendChild(item);
      });
    }
    main.appendChild(panel);
    panel.querySelectorAll('[data-filter]').forEach(b => {
      b.onclick = () => { newsFilter = b.getAttribute('data-filter'); render(); };
    });
    return;
  }

  const brandData = DATA.brands[activeBrand] || { label: brandLabel(activeBrand), watches: [], news: [] };
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<div class="section-title"><h2>${escapeHtml(brandData.label)}</h2><span class="count">${(brandData.watches||[]).length} suivie${(brandData.watches||[]).length>1?'s':''}</span></div>`;

  const news = (brandData.news||[]).slice().sort((a,b) => dateKey(b.date).localeCompare(dateKey(a.date)));
  const newsBox = document.createElement('div');
  newsBox.className = 'brand-news';
  let newsHtml = `<div class="eyebrow">Actus ${escapeHtml(brandData.label)}</div>`;
  if (news.length === 0){
    newsHtml += `<div class="news-text">Rien pour l'instant.</div>`;
  } else {
    news.forEach(n => {
      newsHtml += `<div class="news-item"><div class="news-date">${escapeHtml(formatDate(n.date))}</div><div class="news-text">${escapeHtml(n.text)}</div>${n.link ? `<div class="news-source"><a href="${escapeHtml(n.link)}" target="_blank" rel="noopener">Voir la source ↗</a></div>` : ''}</div>`;
    });
  }
  newsBox.innerHTML = newsHtml;
  panel.appendChild(newsBox);

  const custom = loadCustom();
  const personalWatches = (custom[activeBrand] || []).map(w => ({...w, brand: activeBrand}));
  const watches = (brandData.watches || []).concat(personalWatches);
  if (watches.length === 0){
    panel.innerHTML += `<div class="empty">Aucune montre suivie pour cette marque pour l'instant.</div>`;
  } else {
    watches.forEach((w, i) => panel.appendChild(watchCard(w, activeBrand + '-' + i)));
  }
  main.appendChild(panel);

  panel.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.onclick = () => {
      const el = document.getElementById(btn.getAttribute('data-toggle'));
      el.classList.toggle('open');
    };
  });
  panel.querySelectorAll('[data-remove-custom]').forEach(btn => {
    btn.onclick = () => {
      const [brand, id] = btn.getAttribute('data-remove-custom').split('|');
      const c = loadCustom();
      c[brand] = (c[brand]||[]).filter(w => w.id !== id);
      saveCustom(c);
      render();
    };
  });
}

document.getElementById('btn-reload').onclick = async () => {
  toast('Rechargement…');
  const ok = await loadData(true);
  render();
  toast(ok ? 'Données rechargées' : 'Hors ligne — dernière version en cache');
};

document.getElementById('btn-claude').onclick = () => {
  const prompt = "Actualise le répertoire horloger (repo Lapepite792/repertoire-horloger). Commence par lire source_occasion.json : il liste les sites à utiliser pour les prix d'occasion et les bons plans, avec les règles à suivre. Ensuite, pour Omega, Tissot, LIP et Orient sur les modèles déjà suivis dans data.json, recherche 1) les dernières actualités avec leur lien source, 2) les prix neuf + fourchette occasion en croisant au moins deux sites de source_occasion.json — si un prix neuf est inconnu, renseigne priceNewReason avec la raison, 3) les caractéristiques (mouvement, diamètre, bracelet, année), 4) les variantes classées par tailles/couleurs/matières, 5) des bons plans issus des sites de source_occasion.json (avec lien). Alimente le RADAR (tableau `releases` de data.json) avec des sorties de montres TOUTES MARQUES confondues, pas seulement les marques suivies — une entrée par sortie avec date, brand, model, price, text court et link. Actualise aussi l'onglet tendances — il doit servir à DÉCOUVRIR : privilégie les micro-marques, marques indépendantes et maisons méconnues ou relancées (pas Rolex/Patek/AP/Cartier). Mets à jour data.json directement (nouveautés triées les plus récentes en premier, dates stockées au format JJ-MM-AAAA).";

(async function init(){
  await loadData(false);
  render();
})();
